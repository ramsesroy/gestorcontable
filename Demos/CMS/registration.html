<!DOCTYPE html>
<html lang="es" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Inscripción de Alumnos - CMS Cobranzas (v2.1)</title>

    <link href="https://fonts.googleapis.com/css?family=Lato:400,700%7CRoboto:400,500%7CExo+2:600&display=swap"
        rel="stylesheet">
    <link type="text/css" href="../../public/vendor/spinkit.css" rel="stylesheet">
    <link type="text/css" href="../../public/vendor/perfect-scrollbar.css" rel="stylesheet">
    <link type="text/css" href="../../public/css/material-icons.css" rel="stylesheet">
    <link type="text/css" href="../../public/css/fontawesome.css" rel="stylesheet">
    <link type="text/css" href="../../public/css/preloader.css" rel="stylesheet">
    <link type="text/css" href="../../public/css/app.css" rel="stylesheet">
    <style>
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .help-icon { color: #adb5bd; cursor: help; font-size: 16px; vertical-align: middle; margin-left: 4px; transition: color 0.2s; }
        .help-icon:hover { color: #5567ff; }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5567ff">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="layout-app ">
    <div class="preloader">
        <div class="sk-chase">
            <div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div>
            <div class="sk-chase-dot"></div>
        </div>
    </div>

    <div class="mdk-drawer-layout js-mdk-drawer-layout" data-push data-responsive-width="992px">
        <div class="mdk-drawer-layout__content page-content">

            <!-- Navbar -->
            <div class="navbar navbar-expand navbar-light border-bottom-2" id="default-navbar" data-primary>
                <button class="navbar-toggler w-auto mr-16pt d-block rounded-0" type="button"
                    data-toggle="sidebar">
                    <span class="material-icons">short_text</span>
                </button>
                <a href="index.html" class="navbar-brand mr-16pt">
                    <span class="avatar avatar-sm navbar-brand-icon mr-0 mr-lg-8pt">
                        <span class="avatar-title rounded bg-primary"><img
                                src="../../public/images/illustration/student/128/white.svg" alt="logo"
                                class="img-fluid" /></span>
                    </span>
                    <span class="d-none d-lg-block">CMS Cobranzas</span>
                </a>
            </div>

            <div class="py-32pt bg-alt border-bottom-2">
                <div class="container page__container">
                    <div class="d-flex flex-column flex-md-row align-items-center">
                        <div class="flex">
                            <h2 class="mb-0">Inscripción Inteligente</h2>
                            <p class="lead text-50">Carga un nuevo alumno y genera automáticamente su plan de cuotas.
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-section container page__container">
                <div class="col-lg-8 p-0 mx-auto">
                    <div class="card card-body">
                        <form id="enrollmentForm">
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="dni">DNI / Cédula:</label>
                                    <input id="dni" type="text" class="form-control" placeholder="Ej: 12345678"
                                        required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="fullName">Nombre Completo:</label>
                                    <input id="fullName" type="text" class="form-control" placeholder="Ej: Juan Pérez"
                                        required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="email">Email:</label>
                                    <input id="email" type="email" class="form-control" placeholder="email@ejemplo.com">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="phone">Teléfono:</label>
                                    <input id="phone" type="text" class="form-control" placeholder="Ej: 011 1234-5678">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="birthDate">Fecha de Nacimiento:</label>
                                    <input id="birthDate" type="date" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" for="classStartDate">Inicio de Clases: <i class="material-icons help-icon" data-toggle="tooltip" title="La fecha en la que el alumno comenzará efectivamente sus clases. La primera cuota mensual vencerá un mes después de esta fecha.">help_outline</i></label>
                                    <input id="classStartDate" type="date" class="form-control" required>
                                </div>
                            </div>
                            <div class="form-group mb-24pt">
                                <label class="form-label" for="branch">Sucursal de Origen:</label>
                                <select id="branch" class="form-control custom-select" required>
                                    <option value="" disabled selected>Selecciona una sucursal</option>
                                </select>
                            </div>

                            <div class="form-group mb-24pt">
                                <label class="form-label" for="course">Curso Asignado (Opcional):</label>
                                <div class="d-flex">
                                    <select id="course" class="form-control custom-select" style="flex:1;">
                                        <option value="" selected>Sin curso asignado</option>
                                    </select>
                                    <button type="button" class="btn btn-outline-primary ml-2" id="btnAddCourse">
                                        <i class="material-icons">add</i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-group mb-24pt">
                                <div class="custom-control custom-switch">
                                    <input type="checkbox" class="custom-control-input" id="specialPlanSwitch">
                                    <label class="custom-control-label" for="specialPlanSwitch">¿Es un Plan Especial o Beca?</label>
                                </div>
                            </div>

                            <div class="page-separator">
                                <div class="page-separator__text">Plan de Cuotas</div>
                            </div>

                            <div id="standardPlanFields">
                                <div class="form-group mb-24pt">
                                    <label class="form-label" for="amount">Monto de la cuota mensual:</label>
                                    <div class="input-group input-group-merge">
                                        <input id="amount" type="number" class="form-control form-control-prepended">
                                        <div class="input-group-prepend">
                                            <div class="input-group-text">Gs.</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="form-group mb-24pt">
                                    <label class="form-label" for="installmentsCount">Cantidad de cuotas a generar:</label>
                                    <input id="installmentsCount" type="number" class="form-control" value="12" min="1" max="60">
                                </div>

                                <div class="form-group mb-24pt">
                                    <label class="form-label" for="enrollmentFee">Monto de Matrícula (Único):</label>
                                    <div class="input-group input-group-merge">
                                        <input id="enrollmentFee" type="number" class="form-control form-control-prepended" value="0">
                                        <div class="input-group-prepend">
                                            <div class="input-group-text">Gs.</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div id="specialPlanFields" class="d-none">
                                <div class="form-group mb-24pt">
                                    <label class="form-label" for="totalAmountSpecial">Monto Total del Paquete (Gs.):</label>
                                    <input id="totalAmountSpecial" type="number" class="form-control">
                                </div>
                                <div class="form-group mb-24pt">
                                    <label class="form-label" for="paymentsCountSpecial">Cantidad de Pagos:</label>
                                    <input id="paymentsCountSpecial" type="number" class="form-control" value="1">
                                </div>
                            </div>

                            <div class="form-group mb-24pt">
                                <label class="form-label" for="additionalInfo">Datos Adicionales (Opcional):</label>
                                <textarea id="additionalInfo" class="form-control" rows="3"></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                                <span id="btnText">Inscribir Alumno y Generar Plan</span>
                                <span id="btnLoader" class="spinner-border spinner-border-sm d-none"></span>
                            </button>

                            <div id="successAlert" class="alert alert-soft-success d-none mt-3">
                                <div><strong>¡Éxito!</strong> Alumno inscrito y plan de cuotas generado correctamente.</div>
                                <div class="mt-2" id="successActions">
                                    <button type="button" class="btn btn-sm btn-success" id="btnPrintEnrollment">
                                        <i class="material-icons mr-1">print</i> Imprimir Comprobante de Matrícula
                                    </button>
                                </div>
                            </div>
                            <div id="errorAlert" class="alert alert-soft-danger d-none mt-3"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="mdk-drawer js-mdk-drawer" id="default-drawer">
            <div class="mdk-drawer__content">
                <div class="sidebar sidebar-dark-pickled-bluewood sidebar-left" data-perfect-scrollbar>
                    <a href="index.html" class="sidebar-brand">
                        <span>CMS Cobranzas</span>
                    </a>
                    <ul class="sidebar-menu">
                        <li class="sidebar-menu-item"><a class="sidebar-menu-button" href="dashboard.html">Dashboard</a></li>
                        <li class="sidebar-menu-item active"><a class="sidebar-menu-button" href="registration.html">Inscripción</a></li>
                        <li class="sidebar-menu-item"><a class="sidebar-menu-button" href="search.html">Cobranzas</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../public/vendor/jquery.min.js"></script>
    <script src="../../public/vendor/popper.min.js"></script>
    <script src="../../public/vendor/bootstrap.min.js"></script>
    <script src="../../public/vendor/perfect-scrollbar.min.js"></script>
    <script src="../../public/vendor/dom-factory.js"></script>
    <script src="../../public/vendor/material-design-kit.js"></script>
    <script src="../../public/js/app.js"></script>
    <script src="../../public/js/preloader.js"></script>

    <script>
        const SUPABASE_URL = 'https://rdxvcftqfelrsfwkryzo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkeHZjZnRxZmVscnNmd2tyeXpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NzMzOTQsImV4cCI6MjA4OTE0OTM5NH0.QDz2KZ7pCN0u53sJgNG9RC_GUTQgH6nugDjSIg28eTg';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        $(document).ready(async function () {
            $('[data-toggle="tooltip"]').tooltip();
            
            const todayISO = new Date().toISOString().split('T')[0];
            $('#classStartDate').val(todayISO);

            // Fetch Branches
            const { data: branches } = await supabaseClient.from('branches').select('*').eq('active', true);
            if (branches) {
                branches.forEach(b => $('#branch').append(`<option value="${b.id}">${b.name}</option>`));
            }

            // Fetch Courses
            const { data: courses } = await supabaseClient.from('courses').select('*').order('name');
            if (courses) {
                courses.forEach(c => $('#course').append(`<option value="${c.id}">${c.name}</option>`));
            }

            $('#specialPlanSwitch').on('change', function() {
                const checked = $(this).is(':checked');
                $('#standardPlanFields').toggleClass('d-none', checked);
                $('#specialPlanFields').toggleClass('d-none', !checked);
            });

            $('#enrollmentForm').on('submit', async function (e) {
                e.preventDefault();
                $('#btnText').addClass('d-none');
                $('#btnLoader').removeClass('d-none');
                $('#successAlert, #errorAlert').addClass('d-none');

                const studentData = {
                    dni: $('#dni').val(),
                    full_name: $('#fullName').val(),
                    email: $('#email').val(),
                    phone: $('#phone').val(),
                    birth_date: $('#birthDate').val() || null,
                    start_date: $('#classStartDate').val(),
                    branch_id: $('#branch').val(),
                    course_id: $('#course').val() || null,
                    additional_info: $('#additionalInfo').val()
                };

                const isSpecial = $('#specialPlanSwitch').is(':checked');
                const installmentsCount = parseInt(isSpecial ? $('#paymentsCountSpecial').val() : $('#installmentsCount').val());
                const amount = isSpecial ? Math.round($('#totalAmountSpecial').val() / installmentsCount) : $('#amount').val();

                try {
                    const { data: student, error: sError } = await supabaseClient.from('students').insert([studentData]).select().single();
                    if (sError) throw sError;

                    const installments = [];
                    const baseDate = new Date(studentData.start_date + 'T00:00:00');
                    for (let i = 1; i <= installmentsCount; i++) {
                        const dueDate = new Date(baseDate.getFullYear(), baseDate.getMonth() + i, 10);
                        installments.push({
                            student_id: student.id,
                            installment_number: i,
                            due_date: dueDate.toISOString().split('T')[0],
                            amount: amount,
                            status: 'pendiente'
                        });
                    }
                    await supabaseClient.from('installments').insert(installments);

                    // Enrollment Fee
                    const enrollmentAmount = parseFloat($('#enrollmentFee').val()) || 0;
                    if (enrollmentAmount > 0) {
                        await supabaseClient.from('installments').insert([{
                            student_id: student.id,
                            installment_number: 0,
                            due_date: todayISO,
                            amount: enrollmentAmount,
                            paid_amount: enrollmentAmount,
                            status: 'pagado',
                            paid_at: new Date().toISOString(),
                            concept: 'MATRÍCULA'
                        }]);
                        $('#btnPrintEnrollment').on('click', () => {
                            const params = new URLSearchParams({
                                name: student.full_name,
                                dni: student.dni,
                                concept: 'Matrícula',
                                amount: enrollmentAmount,
                                date: new Date().toLocaleDateString()
                            });
                            window.open('ticket.html?' + params.toString());
                        });
                        $('#successActions').removeClass('d-none');
                    }

                    $('#successAlert').removeClass('d-none');
                    $('#enrollmentForm')[0].reset();
                    $('#classStartDate').val(todayISO);
                } catch (err) {
                    $('#errorAlert').removeClass('d-none').text('Error: ' + err.message);
                } finally {
                    $('#btnText').removeClass('d-none');
                    $('#btnLoader').addClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
